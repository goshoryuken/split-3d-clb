<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>

  <!-- Left: stacked CLBs -->
  <text x="215" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">LaZagna: stacked CLBs</text>
  <text x="215" y="56" text-anchor="middle" font-size="13" fill="#4b5563">a whole 10-LUT CLB on each layer</text>

  <text x="28" y="133" font-size="12" fill="#6b7280">layer 1</text>
  <rect x="80" y="92" width="210" height="82" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="185" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">10-LUT CLB</text>
  <rect x="96" y="120" width="178" height="14" rx="3" fill="#c7d2fe"/>
  <text x="185" y="131" text-anchor="middle" font-size="10" fill="#312e81">crossbar</text>
  <g fill="#ffffff" stroke="#4f46e5" stroke-width="1.2">
    <rect x="98" y="142" width="14" height="14"/><rect x="116" y="142" width="14" height="14"/><rect x="134" y="142" width="14" height="14"/><rect x="152" y="142" width="14" height="14"/><rect x="170" y="142" width="14" height="14"/>
    <rect x="188" y="142" width="14" height="14"/><rect x="206" y="142" width="14" height="14"/><rect x="224" y="142" width="14" height="14"/><rect x="242" y="142" width="14" height="14"/><rect x="260" y="142" width="14" height="14"/>
  </g>

  <text x="28" y="283" font-size="12" fill="#6b7280">layer 0</text>
  <rect x="80" y="242" width="210" height="82" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="185" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#312e81">10-LUT CLB</text>
  <rect x="96" y="270" width="178" height="14" rx="3" fill="#c7d2fe"/>
  <text x="185" y="281" text-anchor="middle" font-size="10" fill="#312e81">crossbar</text>
  <g fill="#ffffff" stroke="#4f46e5" stroke-width="1.2">
    <rect x="98" y="292" width="14" height="14"/><rect x="116" y="292" width="14" height="14"/><rect x="134" y="292" width="14" height="14"/><rect x="152" y="292" width="14" height="14"/><rect x="170" y="292" width="14" height="14"/>
    <rect x="188" y="292" width="14" height="14"/><rect x="206" y="292" width="14" height="14"/><rect x="224" y="292" width="14" height="14"/><rect x="242" y="292" width="14" height="14"/><rect x="260" y="292" width="14" height="14"/>
  </g>

  <rect x="320" y="92" width="62" height="232" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="351" y="112" text-anchor="middle" font-size="11" fill="#374151">routing</text>
  <line x1="351" y1="178" x2="351" y2="238" stroke="#c2410c" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="290" y1="150" x2="320" y2="150" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="290" y1="300" x2="320" y2="300" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="215" y="356" text-anchor="middle" font-size="13" fill="#374151">Layers meet only in the routing.</text>

  <!-- divider -->
  <line x1="440" y1="70" x2="440" y2="350" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Right: split CLB -->
  <text x="660" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#111827">This work: one split CLB</text>
  <text x="660" y="56" text-anchor="middle" font-size="13" fill="#4b5563">a 20-LUT CLB, 10 LUTs per layer</text>

  <text x="476" y="208" font-size="12" fill="#6b7280" transform="rotate(-90 476 208)" text-anchor="middle">one CLB, two layers</text>
  <rect x="500" y="80" width="320" height="256" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>

  <text x="514" y="104" font-size="12" fill="#065f46">layer 1</text>
  <rect x="516" y="112" width="288" height="16" rx="3" fill="#a7f3d0"/>
  <text x="660" y="124" text-anchor="middle" font-size="10" fill="#065f46">crossbar (feeds this layer's 10 LUTs)</text>
  <g fill="#ffffff" stroke="#059669" stroke-width="1.2">
    <rect x="548" y="136" width="18" height="18"/><rect x="572" y="136" width="18" height="18"/><rect x="596" y="136" width="18" height="18"/><rect x="620" y="136" width="18" height="18"/><rect x="644" y="136" width="18" height="18"/>
    <rect x="668" y="136" width="18" height="18"/><rect x="692" y="136" width="18" height="18"/><rect x="716" y="136" width="18" height="18"/><rect x="740" y="136" width="18" height="18"/><rect x="764" y="136" width="18" height="18"/>
  </g>

  <line x1="516" y1="208" x2="804" y2="208" stroke="#059669" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="572" y1="160" x2="572" y2="256" stroke="#c2410c" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="748" y1="160" x2="748" y2="256" stroke="#c2410c" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="588" y="198" width="144" height="20" rx="4" fill="#ffffff"/>
  <text x="660" y="212" text-anchor="middle" font-size="11" fill="#9a3412">crossings inside the CLB</text>

  <text x="514" y="326" font-size="12" fill="#065f46">layer 0</text>
  <rect x="516" y="296" width="288" height="16" rx="3" fill="#a7f3d0"/>
  <text x="660" y="308" text-anchor="middle" font-size="10" fill="#065f46">crossbar (feeds this layer's 10 LUTs)</text>
  <g fill="#ffffff" stroke="#059669" stroke-width="1.2">
    <rect x="548" y="262" width="18" height="18"/><rect x="572" y="262" width="18" height="18"/><rect x="596" y="262" width="18" height="18"/><rect x="620" y="262" width="18" height="18"/><rect x="644" y="262" width="18" height="18"/>
    <rect x="668" y="262" width="18" height="18"/><rect x="692" y="262" width="18" height="18"/><rect x="716" y="262" width="18" height="18"/><rect x="740" y="262" width="18" height="18"/><rect x="764" y="262" width="18" height="18"/>
  </g>
  <text x="660" y="356" text-anchor="middle" font-size="13" fill="#374151">Bigger cluster, small crossbars: fewer hops between CLBs.</text>

  <text x="440" y="388" text-anchor="middle" font-size="12" fill="#6b7280">Slowest paths on Koios designs: about 16.1 CLB-to-CLB hops with stacked CLBs, 13.4 with the split CLB.</text>
</svg>
